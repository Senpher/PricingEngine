[tool.poetry]
name = "pricingengine"
version = "0.1.0"
description = ""
authors = ["Senpher <crazykronecker@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
quantlib = "^1.39"
pandas = "^2.3.2"
# Runtime validation/libs
pydantic = "^2"
msgspec = "^0.19.0"

# --- Dev-only tools (IDE + CI) ---
poetry-core = "^2.2.1"
[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"            # formatter + linter
mypy = "^1.11"
pytest = "^8.4.2"
pandas-stubs = ">=2.3.2.250827"
types-requests = "*"
types-python-dateutil = "*"
# (optional)
pre-commit = "^3.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------- Ruff ----------
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["PortfolioEngine", "PricingEngine", "RiskEngine", "tests", "."]


[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "PL", "RUF"]
ignore = ["E501"]  # let formatter / judgement handle wrapping

[tool.ruff.lint.isort]
known-first-party = [
    "PortfolioEngine", "PricingEngine", "RiskEngine",
    "portfolioengine", "pricingengine", "riskengine"
]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers ok in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
plugins = ["pydantic.mypy", "msgspec.mypy_plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------- pytest ----------
[tool.pytest.ini_options]
pythonpath = ["."]
